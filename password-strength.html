<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Generator</title>
<style>
  :root{
    --bg: #0b0f12;
    --panel: #10161b;
    --line: #1e2830;
    --text: #dce4e8;
    --dim: #6f838d;
    --weak: #ff5c5c;
    --medium: #ffb454;
    --strong: #4ee6a3;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 32px 16px;
  }
  .card{
    width: 100%;
    max-width: 460px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--dim);
    padding: 28px 28px 24px;
    transition: border-left-color 180ms ease;
  }
  .card.weak{ border-left-color: var(--weak); }
  .card.medium{ border-left-color: var(--medium); }
  .card.strong{ border-left-color: var(--strong); }

  h1{
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.2px;
    margin: 0 0 20px;
  }
  h2{
    font-size: 11px;
    font-weight: 600;
    color: var(--dim);
    font-family: var(--mono);
    letter-spacing: 0.3px;
    margin: 26px 0 10px;
  }

  /* --- output row --- */
  .output-row{
    display:flex;
    align-items:center;
    background: var(--bg);
    border: 1px solid var(--line);
    padding: 0 6px 0 10px;
  }
  .output-row:focus-within{ border-color: var(--dim); }
  #output{
    flex:1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 16px;
    padding: 12px 0;
    letter-spacing: 0.5px;
  }
  .icon-btn{
    background:none;
    border:none;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 12px;
    cursor:pointer;
    padding: 8px 8px;
    white-space:nowrap;
  }
  .icon-btn:hover{ color: var(--text); }
  .icon-btn.copied{ color: var(--strong); }

  .meter{
    height: 4px;
    background: var(--line);
    margin-top: 10px;
    overflow:hidden;
  }
  .meter-fill{
    height:100%;
    width: 0%;
    background: var(--dim);
    transition: width 200ms ease, background 200ms ease;
  }

  .strength-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-top: 10px;
  }
  .strength-label{ font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .strength-value{ font-family: var(--mono); font-size: 13px; font-weight: 700; }
  .strength-value.weak{ color: var(--weak); }
  .strength-value.medium{ color: var(--medium); }
  .strength-value.strong{ color: var(--strong); }

  /* --- options --- */
  .option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .option:first-of-type{ border-top: 1px solid var(--line); }
  .option label{ cursor:pointer; }

  .length-row{
    display:flex;
    align-items:center;
    gap: 12px;
  }
  .length-row input[type="range"]{
    flex:1;
    accent-color: var(--strong);
  }
  .length-value{
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    width: 24px;
    text-align:right;
  }

  input[type="checkbox"]{
    accent-color: var(--strong);
    width: 15px;
    height: 15px;
    cursor:pointer;
  }

  .generate-btn{
    width:100%;
    margin-top: 20px;
    padding: 11px 0;
    background: transparent;
    border: 1px solid var(--dim);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.5px;
    cursor:pointer;
    transition: border-color 150ms ease, color 150ms ease;
  }
  .generate-btn:hover{ border-color: var(--strong); color: var(--strong); }

  /* --- history --- */
  ul.history{
    list-style:none;
    margin:0;
    padding:0;
    border-top: 1px solid var(--line);
    max-height: 190px;
    overflow-y:auto;
  }
  ul.history li{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--dim);
  }
  ul.history li .pw-text{
    color: var(--text);
    overflow:hidden;
    text-overflow: ellipsis;
    white-space:nowrap;
  }
  ul.history li button{
    background:none;
    border:none;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 11px;
    cursor:pointer;
    flex-shrink:0;
  }
  ul.history li button:hover{ color: var(--text); }
  .history-empty{
    padding: 14px 0;
    font-size: 12px;
    color: var(--dim);
    font-style: normal;
  }

  .hint{
    margin-top: 16px;
    font-size: 11px;
    color: var(--dim);
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="card" id="card">
  <h1>Password Generator</h1>

  <div class="output-row">
    <input type="text" id="output" readonly>
    <button class="icon-btn" id="copyBtn" type="button">copy</button>
  </div>
  <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
  <div class="strength-row">
    <span class="strength-label">Strength</span>
    <span class="strength-value" id="strengthValue">—</span>
  </div>

  <h2>Options</h2>

  <div class="option">
    <label for="length">Length</label>
    <div class="length-row" style="width:60%;">
      <input type="range" id="length" min="6" max="32" value="16">
      <span class="length-value" id="lengthValue">16</span>
    </div>
  </div>
  <div class="option">
    <label for="upper">Uppercase (A–Z)</label>
    <input type="checkbox" id="upper" checked>
  </div>
  <div class="option">
    <label for="lower">Lowercase (a–z)</label>
    <input type="checkbox" id="lower" checked>
  </div>
  <div class="option">
    <label for="numbers">Numbers (0–9)</label>
    <input type="checkbox" id="numbers" checked>
  </div>
  <div class="option">
    <label for="symbols">Symbols (!@#$…)</label>
    <input type="checkbox" id="symbols" checked>
  </div>
  <div class="option" style="border-bottom:none;">
    <label for="ambiguous">Exclude ambiguous (l1IO0)</label>
    <input type="checkbox" id="ambiguous">
  </div>

  <button class="generate-btn" id="generateBtn" type="button">generate new password</button>

  <h2>History <span id="historyCount" style="color:var(--dim); font-weight:400;"></span></h2>
  <ul class="history" id="history"></ul>

  <div class="hint">Generated locally in your browser using the Web Crypto API. History is kept only for this session and clears on reload.</div>
</div>

<script>
  const CHARSETS = {
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower: 'abcdefghijklmnopqrstuvwxyz',
    numbers: '0123456789',
    symbols: '!@#$%^&*()-_=+[]{};:,.<>?'
  };
  const AMBIGUOUS = /[l1IO0]/g;

  const els = {
    output: document.getElementById('output'),
    copyBtn: document.getElementById('copyBtn'),
    card: document.getElementById('card'),
    meterFill: document.getElementById('meterFill'),
    strengthValue: document.getElementById('strengthValue'),
    length: document.getElementById('length'),
    lengthValue: document.getElementById('lengthValue'),
    upper: document.getElementById('upper'),
    lower: document.getElementById('lower'),
    numbers: document.getElementById('numbers'),
    symbols: document.getElementById('symbols'),
    ambiguous: document.getElementById('ambiguous'),
    generateBtn: document.getElementById('generateBtn'),
    history: document.getElementById('history'),
    historyCount: document.getElementById('historyCount')
  };

  let history = [];

  function secureRandomInt(max) {
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return arr[0] % max;
  }

  function buildCharset() {
    let set = '';
    if (els.upper.checked) set += CHARSETS.upper;
    if (els.lower.checked) set += CHARSETS.lower;
    if (els.numbers.checked) set += CHARSETS.numbers;
    if (els.symbols.checked) set += CHARSETS.symbols;
    if (els.ambiguous.checked) set = set.replace(AMBIGUOUS, '');
    return set;
  }

  function generatePassword() {
    const length = parseInt(els.length.value, 10);
    const charset = buildCharset();
    if (!charset) return '';
    return buildWithGuarantee(length, charset);
  }

  function buildWithGuarantee(length, charset) {
    const selected = [];
    if (els.upper.checked) selected.push(strip(CHARSETS.upper));
    if (els.lower.checked) selected.push(strip(CHARSETS.lower));
    if (els.numbers.checked) selected.push(strip(CHARSETS.numbers));
    if (els.symbols.checked) selected.push(strip(CHARSETS.symbols));

    let chars = [];
    // seed one from each selected category, if it fits within length
    selected.forEach(set => {
      if (set.length && chars.length < length) {
        chars.push(set[secureRandomInt(set.length)]);
      }
    });
    while (chars.length < length) {
      chars.push(charset[secureRandomInt(charset.length)]);
    }
    // shuffle
    for (let i = chars.length - 1; i > 0; i--) {
      const j = secureRandomInt(i + 1);
      [chars[i], chars[j]] = [chars[j], chars[i]];
    }
    return chars.join('');
  }

  function strip(set) {
    return els.ambiguous.checked ? set.replace(AMBIGUOUS, '') : set;
  }

  // --- strength evaluation (shared logic with checker) ---
  const COMMON_WORDS = [
    'password','summer','winter','spring','autumn','welcome','qwerty','admin',
    'letmein','monkey','dragon','football','baseball','iloveyou','master',
    'shadow','sunshine','princess','login','abc123','starwars','trustno1'
  ];

  function evaluate(pw) {
    const checks = {
      length: pw.length >= 8,
      upper: /[A-Z]/.test(pw),
      lower: /[a-z]/.test(pw),
      number: /[0-9]/.test(pw),
      special: /[^A-Za-z0-9]/.test(pw)
    };
    const lower = pw.toLowerCase();
    const flagged = COMMON_WORDS.some(w => lower.includes(w));
    const passCount = Object.values(checks).filter(Boolean).length;

    let level;
    if (!pw.length) level = 'empty';
    else if (passCount <= 2) level = 'weak';
    else if (passCount <= 4 || flagged) level = 'medium';
    else if (pw.length >= 12) level = 'strong';
    else level = 'medium';

    return level;
  }

  function renderStrength(pw) {
    const level = evaluate(pw);
    els.card.className = 'card' + (level !== 'empty' ? ' ' + level : '');
    els.strengthValue.className = 'strength-value ' + level;
    els.strengthValue.textContent = level === 'empty' ? '—' : level.toUpperCase();
    const pct = { empty: 0, weak: 30, medium: 65, strong: 100 }[level];
    els.meterFill.style.width = pct + '%';
    els.meterFill.style.background = {
      empty: 'var(--dim)', weak: 'var(--weak)', medium: 'var(--medium)', strong: 'var(--strong)'
    }[level];
  }

  function renderHistory() {
    els.history.innerHTML = '';
    els.historyCount.textContent = history.length ? `(${history.length})` : '';
    if (!history.length) {
      const li = document.createElement('li');
      li.className = 'history-empty';
      li.textContent = 'No passwords generated yet.';
      li.style.border = 'none';
      els.history.appendChild(li);
      return;
    }
    history.slice().reverse().forEach((pw, idx) => {
      const li = document.createElement('li');
      const span = document.createElement('span');
      span.className = 'pw-text';
      span.textContent = pw;
      const btn = document.createElement('button');
      btn.textContent = 'copy';
      btn.addEventListener('click', () => copyText(pw, btn));
      li.appendChild(span);
      li.appendChild(btn);
      els.history.appendChild(li);
    });
  }

  async function copyText(text, btnEl) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      // fallback
      const temp = document.createElement('textarea');
      temp.value = text;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand('copy');
      document.body.removeChild(temp);
    }
    const original = btnEl.textContent;
    btnEl.textContent = 'copied';
    btnEl.classList.add('copied');
    setTimeout(() => {
      btnEl.textContent = original;
      btnEl.classList.remove('copied');
    }, 1200);
  }

  function generate() {
    const pw = generatePassword();
    if (!pw) {
      els.output.value = '';
      renderStrength('');
      return;
    }
    els.output.value = pw;
    renderStrength(pw);
    history.push(pw);
    if (history.length > 20) history.shift();
    renderHistory();
  }

  els.length.addEventListener('input', () => {
    els.lengthValue.textContent = els.length.value;
  });
  els.generateBtn.addEventListener('click', generate);
  els.copyBtn.addEventListener('click', () => copyText(els.output.value, els.copyBtn));

  [els.upper, els.lower, els.numbers, els.symbols, els.ambiguous].forEach(el => {
    el.addEventListener('change', () => {
      // ensure at least one charset stays checked
      const anyChecked = [els.upper, els.lower, els.numbers, els.symbols].some(c => c.checked);
      if (!anyChecked) el.checked = true;
    });
  });

  renderHistory();
  generate();
</script>

</body>
</html>
