<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Username Generator</title>
<style>
  :root{
    --bg: #0b0f12;
    --panel: #10161b;
    --line: #1e2830;
    --text: #dce4e8;
    --dim: #6f838d;
    --accent: #4ee6a3;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 32px 16px;
  }
  .card{
    width: 100%;
    max-width: 460px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    padding: 28px 28px 24px;
  }

  h1{
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.2px;
    margin: 0 0 20px;
  }
  h2{
    font-size: 11px;
    font-weight: 600;
    color: var(--dim);
    font-family: var(--mono);
    letter-spacing: 0.3px;
    margin: 26px 0 10px;
  }

  /* --- output row --- */
  .output-row{
    display:flex;
    align-items:center;
    background: var(--bg);
    border: 1px solid var(--line);
    padding: 0 6px 0 10px;
  }
  .output-row:focus-within{ border-color: var(--dim); }
  #output{
    flex:1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 16px;
    padding: 12px 0;
    letter-spacing: 0.5px;
  }
  .icon-btn{
    background:none;
    border:none;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 12px;
    cursor:pointer;
    padding: 8px 8px;
    white-space:nowrap;
  }
  .icon-btn:hover{ color: var(--text); }
  .icon-btn.copied{ color: var(--accent); }

  .available-hint{
    margin-top: 8px;
    font-size: 11px;
    color: var(--dim);
    font-family: var(--mono);
  }

  /* --- options --- */
  .option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .option:first-of-type{ border-top: 1px solid var(--line); }
  .option label{ cursor:pointer; }

  .style-select{
    display:flex;
    gap: 6px;
  }
  .style-btn{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--dim);
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px 10px;
    cursor:pointer;
  }
  .style-btn.active{
    border-color: var(--accent);
    color: var(--accent);
  }
  .style-btn:hover:not(.active){ color: var(--text); }

  .length-row{
    display:flex;
    align-items:center;
    gap: 12px;
    width: 60%;
  }
  .length-row input[type="range"]{
    flex:1;
    accent-color: var(--accent);
  }
  .length-value{
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    width: 24px;
    text-align:right;
  }

  select{
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 8px;
    cursor:pointer;
  }

  input[type="checkbox"]{
    accent-color: var(--accent);
    width: 15px;
    height: 15px;
    cursor:pointer;
  }

  .generate-btn{
    width:100%;
    margin-top: 20px;
    padding: 11px 0;
    background: transparent;
    border: 1px solid var(--dim);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.5px;
    cursor:pointer;
    transition: border-color 150ms ease, color 150ms ease;
  }
  .generate-btn:hover{ border-color: var(--accent); color: var(--accent); }

  /* --- history --- */
  ul.history{
    list-style:none;
    margin:0;
    padding:0;
    border-top: 1px solid var(--line);
    max-height: 190px;
    overflow-y:auto;
  }
  ul.history li{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--dim);
  }
  ul.history li .name-text{
    color: var(--text);
    overflow:hidden;
    text-overflow: ellipsis;
    white-space:nowrap;
  }
  ul.history li button{
    background:none;
    border:none;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 11px;
    cursor:pointer;
    flex-shrink:0;
  }
  ul.history li button:hover{ color: var(--text); }
  .history-empty{
    padding: 14px 0;
    font-size: 12px;
    color: var(--dim);
    border: none !important;
  }

  .hint{
    margin-top: 16px;
    font-size: 11px;
    color: var(--dim);
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="card" id="card">
  <h1>Username Generator</h1>

  <div class="output-row">
    <input type="text" id="output" readonly>
    <button class="icon-btn" id="copyBtn" type="button">copy</button>
  </div>
  <div class="available-hint" id="lengthHint"></div>

  <h2>Style</h2>
  <div class="style-select" id="styleSelect">
    <button class="style-btn active" data-style="word" type="button">word pair</button>
    <button class="style-btn" data-style="handle" type="button">handle</button>
    <button class="style-btn" data-style="random" type="button">random</button>
  </div>

  <h2>Options</h2>

  <div class="option">
    <label for="numbers">Append numbers</label>
    <input type="checkbox" id="numbers" checked>
  </div>
  <div class="option">
    <label for="separator">Separator</label>
    <select id="separator">
      <option value="">none</option>
      <option value="_">underscore _</option>
      <option value="-">hyphen -</option>
      <option value=".">dot .</option>
    </select>
  </div>
  <div class="option">
    <label for="case">Casing</label>
    <select id="case">
      <option value="title">Title Case</option>
      <option value="lower">lower case</option>
      <option value="upper">UPPER CASE</option>
    </select>
  </div>
  <div class="option" id="lengthOption" style="display:none;">
    <label for="length">Length</label>
    <div class="length-row">
      <input type="range" id="length" min="5" max="20" value="10">
      <span class="length-value" id="lengthValue">10</span>
    </div>
  </div>

  <button class="generate-btn" id="generateBtn" type="button">generate new username</button>

  <h2>History <span id="historyCount" style="color:var(--dim); font-weight:400;"></span></h2>
  <ul class="history" id="history"></ul>

  <div class="hint">Generated locally in your browser. History is kept only for this session and clears on reload.</div>
</div>

<script>
  const ADJECTIVES = [
    'Swift','Quiet','Bold','Brave','Lucky','Clever','Bright','Calm','Fuzzy','Wild',
    'Golden','Silent','Rapid','Lone','Vivid','Cosmic','Rusty','Arctic','Amber','Iron',
    'Mellow','Nimble','Sunny','Shadow','Crimson','Frosty','Electric','Gentle','Sly','Noble'
  ];
  const NOUNS = [
    'Falcon','Otter','Comet','Tiger','Willow','Raven','Ember','Canyon','Meadow','Wolf',
    'Harbor','Ridge','Ranger','Pixel','Compass','Lantern','Maple','Boulder','Sparrow','Cinder',
    'Voyager','Panther','Horizon','Juniper','Nova','Drifter','Beacon','Thistle','Anchor','Viper'
  ];
  const CONSONANTS = 'bcdfghjklmnpqrstvwxyz';
  const VOWELS = 'aeiou';

  const els = {
    output: document.getElementById('output'),
    copyBtn: document.getElementById('copyBtn'),
    lengthHint: document.getElementById('lengthHint'),
    styleSelect: document.getElementById('styleSelect'),
    numbers: document.getElementById('numbers'),
    separator: document.getElementById('separator'),
    caseSel: document.getElementById('case'),
    lengthOption: document.getElementById('lengthOption'),
    length: document.getElementById('length'),
    lengthValue: document.getElementById('lengthValue'),
    generateBtn: document.getElementById('generateBtn'),
    history: document.getElementById('history'),
    historyCount: document.getElementById('historyCount')
  };

  let currentStyle = 'word';
  let history = [];

  function secureRandomInt(max) {
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return arr[0] % max;
  }

  function pick(list) {
    return list[secureRandomInt(list.length)];
  }

  function applyCase(word, mode, isFirst) {
    if (mode === 'lower') return word.toLowerCase();
    if (mode === 'upper') return word.toUpperCase();
    // title case: capitalize each word
    return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
  }

  function randomDigits(n) {
    let s = '';
    for (let i = 0; i < n; i++) s += secureRandomInt(10);
    return s;
  }

  function buildWordPair() {
    const sep = els.separator.value;
    const caseMode = els.caseSel.value;
    let adj = applyCase(pick(ADJECTIVES), caseMode);
    let noun = applyCase(pick(NOUNS), caseMode);
    let base = sep ? `${adj}${sep}${noun}` : `${adj}${noun}`;
    if (els.numbers.checked) base += (sep || '') + randomDigits(2);
    return base;
  }

  function buildHandle() {
    // alternating consonant/vowel pronounceable core, e.g. "kavelon"
    const sep = els.separator.value;
    const caseMode = els.caseSel.value;
    const coreLen = 7;
    let core = '';
    for (let i = 0; i < coreLen; i++) {
      core += (i % 2 === 0) ? pick(CONSONANTS) : pick(VOWELS);
    }
    core = applyCase(core, caseMode);
    let base = core;
    if (els.numbers.checked) base += (sep || '') + randomDigits(3);
    return base;
  }

  function buildRandom() {
    const length = parseInt(els.length.value, 10);
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz' + (els.numbers.checked ? '0123456789' : '');
    let out = '';
    for (let i = 0; i < length; i++) out += chars[secureRandomInt(chars.length)];
    return out;
  }

  function generateUsername() {
    if (currentStyle === 'word') return buildWordPair();
    if (currentStyle === 'handle') return buildHandle();
    return buildRandom();
  }

  function updateOptionVisibility() {
    els.lengthOption.style.display = currentStyle === 'random' ? 'flex' : 'none';
    els.separator.parentElement.style.display = currentStyle === 'random' ? 'none' : 'flex';
    els.caseSel.parentElement.style.display = currentStyle === 'random' ? 'none' : 'flex';
  }

  function renderHistory() {
    els.history.innerHTML = '';
    els.historyCount.textContent = history.length ? `(${history.length})` : '';
    if (!history.length) {
      const li = document.createElement('li');
      li.className = 'history-empty';
      li.textContent = 'No usernames generated yet.';
      els.history.appendChild(li);
      return;
    }
    history.slice().reverse().forEach(name => {
      const li = document.createElement('li');
      const span = document.createElement('span');
      span.className = 'name-text';
      span.textContent = name;
      const btn = document.createElement('button');
      btn.textContent = 'copy';
      btn.addEventListener('click', () => copyText(name, btn));
      li.appendChild(span);
      li.appendChild(btn);
      els.history.appendChild(li);
    });
  }

  async function copyText(text, btnEl) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const temp = document.createElement('textarea');
      temp.value = text;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand('copy');
      document.body.removeChild(temp);
    }
    const original = btnEl.textContent;
    btnEl.textContent = 'copied';
    btnEl.classList.add('copied');
    setTimeout(() => {
      btnEl.textContent = original;
      btnEl.classList.remove('copied');
    }, 1200);
  }

  function generate() {
    const name = generateUsername();
    els.output.value = name;
    els.lengthHint.textContent = `${name.length} characters`;
    history.push(name);
    if (history.length > 20) history.shift();
    renderHistory();
  }

  els.styleSelect.addEventListener('click', (e) => {
    const btn = e.target.closest('.style-btn');
    if (!btn) return;
    document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentStyle = btn.dataset.style;
    updateOptionVisibility();
    generate();
  });

  els.length.addEventListener('input', () => {
    els.lengthValue.textContent = els.length.value;
  });

  els.generateBtn.addEventListener('click', generate);
  els.copyBtn.addEventListener('click', () => copyText(els.output.value, els.copyBtn));
  els.numbers.addEventListener('change', generate);
  els.separator.addEventListener('change', generate);
  els.caseSel.addEventListener('change', generate);
  els.length.addEventListener('change', generate);

  updateOptionVisibility();
  renderHistory();
  generate();
</script>

</body>
</html>
